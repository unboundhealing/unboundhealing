name: Diagnose Homepage Intelligence

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run homepage intelligence diagnostic
        run: |
          set -euo pipefail
          python3 assets/diagnose-homepage.py
