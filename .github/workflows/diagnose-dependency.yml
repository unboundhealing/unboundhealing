name: Diagnose Dependency Map

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "assets/**"

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run dependency diagnostics
        run: |
          set -euo pipefail
          echo "🧭 Running dependency diagnostics..."
          python3 assets/diagnose-dependency.py
