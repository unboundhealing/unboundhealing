name: Diagnose OpenGraph

on:
  workflow_dispatch:

jobs:
  diagnose-opengraph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run OpenGraph diagnostics
        run: |
          python3 assets/diagnose-opengraph.py
