name: Build Unbound Healing Site (v3 Stable)

on:
  push:
    branches:
      - main

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repo
      # -------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # -------------------------------------
      # 2. System dependencies
      # -------------------------------------
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      # -------------------------------------
      # 3. Make scripts executable
      # -------------------------------------
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # -------------------------------------
      # 4. Python environment
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install beautifulsoup4

      # -------------------------------------
      # 5. Generate full system
      # -------------------------------------
      - name: Generate full site system
        run: |
          set -e
          ./scripts/generate-site.sh

      # -------------------------------------
      # 6. Debug output
      # -------------------------------------
      - name: Verify build outputs
        run: |
          echo "Checking assets..."
          ls -R ./assets || true

      # -------------------------------------
      # 7. Upload artifacts (optional but fine)
      # -------------------------------------
      - name: Upload site build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unbound-healing-site
          path: |
            feed.xml
            sitemap.xml
            link-reference.md
            search-index.json
            tags.json
            assets/**/*.html

      # -------------------------------------
      # 8. DEPLOY TO GITHUB PAGES
      # -------------------------------------
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
