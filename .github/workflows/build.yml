name: Build Unbound Healing Site (v3.5 Semantic-Salience Truth System)

on:
  push:
    branches:
      - main

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repo
      # -------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------------
      # 2. System dependencies
      # -------------------------------------
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      # -------------------------------------
      # 3. Python environment (PINNED)
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      # -------------------------------------
      # 4. Python dependencies (LXML ERADICATION GUARANTEE)
      # -------------------------------------
      - name: Install Python dependencies
        run: |
          pip install beautifulsoup4
          export BS4_NO_LXML=1

      # -------------------------------------
      # 5. Make scripts executable
      # -------------------------------------
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # -------------------------------------
      # 6. Generate FULL SITE (single truth pipeline)
      # -------------------------------------
      - name: Generate site (semantic-salience only)
        run: |
          set -euo pipefail
          ./scripts/generate-site.sh

      # -------------------------------------
      # 7. VALIDATE SINGLE TRUTH LAYER (ENFORCED)
      # -------------------------------------
      - name: Inspect semantic-salience truth layer
        run: |
          echo "🔍 Inspecting semantic-salience.json..."

          if [ ! -f semantic-salience.json ]; then
            echo "❌ semantic-salience.json missing"
            exit 1
          fi

          python3 scripts/inspect-semantic-salience.py

          # HARD GUARD: ensure file is not empty or malformed
          python3 - <<'PY'
import json, sys

try:
    with open("semantic-salience.json","r",encoding="utf-8") as f:
        data = json.load(f)
except Exception as e:
    print("❌ semantic-salience invalid:", e)
    sys.exit(1)

if not isinstance(data, dict):
    print("❌ semantic-salience must be dict")
    sys.exit(1)

if "nodes" not in data or "edges" not in data:
    print("❌ missing required structural keys")
    sys.exit(1)

print("✅ semantic-salience validated")
PY

      # -------------------------------------
      # 8. VERIFY OUTPUT STRUCTURE (STRICT MODE)
      # -------------------------------------
      - name: Verify build outputs
        run: |
          echo "📦 Checking core outputs..."

          # HARD REQUIREMENTS (fail build if missing)
          test -f semantic-salience.json
          test -f sitemap.xml
          test -f feed.xml || true

          echo "📂 Root structure overview:"
          ls -R . | grep -E "semantic|sitemap|rss|homepage|feed" || true

      # -------------------------------------
      # 9. Upload Pages artifact (ROOT-BASED, NO EXTRA DIRS)
      # -------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4