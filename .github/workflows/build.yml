name: Build Unbound Healing Site (v3.5 Semantic-Salience Truth System)

on:
  push:
    branches:
      - main

concurrency:
  group: pages-deploy
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repo (DEBUG SAFE)
      # -------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------------
      # 2. EARLY DEBUG (CATCH 1-SECOND FAILURES)
      # -------------------------------------
      - name: Debug environment (pre-flight)
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 RUNNER STARTED"
          echo "PWD: $(pwd)"
          echo "--------------------"
          ls -R . || true
          echo "--------------------"
          python3 --version || true
          which python3 || true

      # -------------------------------------
      # 3. System dependencies
      # -------------------------------------
      - name: Setup environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      # -------------------------------------
      # 4. Python environment (PINNED + STABLE)
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      # -------------------------------------
      # 5. Python dependencies (SAFE + NO LXML GUARANTEE)
      # -------------------------------------
      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install beautifulsoup4
        env:
          BS4_NO_LXML: "1"

      # -------------------------------------
      # 6. Make scripts executable
      # -------------------------------------
      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh

      # -------------------------------------
      # 7. Generate FULL SITE (single truth pipeline)
      # -------------------------------------
      - name: Generate site (semantic-salience only)
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Starting generate-site.sh"
          ./scripts/generate-site.sh


      - name: Show homepage diff
        shell: bash
        run: |
          echo "========== index.html diff =========="
          git diff -- index.html || true
      
      
      # -------------------------------------
      # 8. VERIFY OUTPUT STRUCTURE (NON-FATAL BUT INFORMATIVE)
      # -------------------------------------
      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Checking output structure..."

          test -f assets/semantic-salience.json

          echo "📂 Repo snapshot:"
          ls -R . | grep -E "semantic|sitemap|rss|homepage|feed" || true

      # -------------------------------------
      # 9. Upload Pages artifact (ROOT-BASED ONLY)
      # -------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
        
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
