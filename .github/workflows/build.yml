name: Build Unbound Healing Site (v3.4 Stable)

on:
  push:
    branches:
      - main

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repo
      # -------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------------
      # 2. System dependencies
      # -------------------------------------
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      # -------------------------------------
      # 3. Make scripts executable
      # -------------------------------------
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # -------------------------------------
      # 4. Python environment
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install beautifulsoup4

      # -------------------------------------
      # 5. Generate full system
      # -------------------------------------
      - name: Generate full site system
        run: |
          set -e
          ./scripts/generate-site.sh

      # -------------------------------------
      # 6. 🔍 OPTION C: CONTENT MODEL INSPECTION (FIXED YAML SAFE)
      # -------------------------------------
      - name: Inspect content-model.json schema (Option C)
        run: |
          echo "🔍 Inspecting content-model.json..."

          if [ ! -f content-model.json ]; then
            echo "❌ content-model.json missing"
            exit 1
          fi

          python3 << 'EOF'
import json
import sys

try:
    data = json.load(open('content-model.json'))
except Exception as e:
    print('❌ JSON parse error:', e)
    sys.exit(1)

if not isinstance(data, dict):
    print('❌ Invalid structure: not a dict')
    sys.exit(1)

print('🔑 TOP-LEVEL KEYS:', list(data.keys()))

if len(data.keys()) == 0:
    print('❌ EMPTY MODEL DETECTED - STOPPING BUILD')
    sys.exit(1)

for k in ['pages', 'nodes', 'content']:
    if k in data:
        val = data[k]
        size = len(val) if isinstance(val, list) else 'non-list'
        print(f'✅ Found key: {k} (count={size})')
EOF

      # -------------------------------------
      # 7. Verify outputs
      # -------------------------------------
      - name: Verify build outputs
        run: |
          echo "Checking assets..."
          ls -R ./assets || true

      # -------------------------------------
      # 8. Upload Pages artifact
      # -------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
