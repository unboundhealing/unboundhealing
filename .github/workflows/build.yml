name: Build Unbound Healing Site (v3 Stable)

on:
  push:
    branches:
      - main
    paths-ignore:
      - feed.xml
      - sitemap.xml
      - link-reference.md
      - search-index.json
      - tags.json

      - content-model.json \
      - content-graph.json \
      - link-suggestions.json \
      - semantic-model.json \
      - semantic-graph.json \
      - concept-clusters.json \
      - homepage-intelligence.json
      
concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      - name: Make scripts executable
        run: chmod +x scripts/*.sh
        
      - name: Set up Python (for content parsing)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install beautifulsoup4
      - name: Generate full site system
        run: |
          set -e
          ./scripts/generate-site.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unbound-healing-build
          path: |
            feed.xml
            sitemap.xml
            link-reference.md
            search-index.json
            tags.json
