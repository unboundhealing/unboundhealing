name: Build Unbound Healing Site

on:
  push:
    branches:
      - main

# IMPORTANT: allows GitHub Actions to push generated files back to repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repository
      # -------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------
      # 2. System dependencies (Linux runner)
      # -------------------------------------
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      # -------------------------------------
      # 3. Make scripts executable
      # -------------------------------------
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # -------------------------------------
      # 4. Run full site generation pipeline
      # -------------------------------------
      - name: Generate full site system
        run: |
          set -e
          ./scripts/generate-site.sh

      # -------------------------------------
      # 5. Commit generated outputs
      # -------------------------------------
      - name: Commit generated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            feed.xml \
            sitemap.xml \
            link-reference.md \
            search-index.json \
            tags.json || true

          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "auto-update generated site files"

      # -------------------------------------
      # 6. Push changes back to GitHub
      # -------------------------------------
      - name: Push changes
        run: |
          git push
