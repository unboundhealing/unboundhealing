name: Build Unbound Healing Site

on:
push:
branches:
- main

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Set up environment
    run: |
      sudo apt-get update
      sudo apt-get install -y bash curl jq

  - name: Make scripts executable
    run: chmod +x scripts/*.sh

  - name: Generate full site system
    run: |
      ./scripts/generate-site.sh

  - name: Commit generated files
    run: |
      git config user.name "github-actions"
      git config user.email "github-actions@users.noreply.github.com"

      git add \
        sitemap.xml \
        feed.xml \
        link-reference.md \
        search-index.json \
        tags.json

      git diff --cached --quiet || \
      git commit -m "[skip ci] auto-update generated site files"

  - name: Push changes
    run: git push
```
