name: Build Unbound Healing Site (v3.5 Semantic-Salience Truth System)

on:
  push:
    branches:
      - main

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repo (DEBUG SAFE)
      # -------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------------
      # 2. EARLY DEBUG (CATCH 1-SECOND FAILURES)
      # -------------------------------------
      - name: Debug environment (pre-flight)
        shell: bash
        run: |
          echo "🚀 RUNNER STARTED"
          echo "PWD: $(pwd)"
          echo "--------------------"
          ls -R . || true
          echo "--------------------"
          python3 --version || true
          which python3 || true

      # -------------------------------------
      # 3. System dependencies
      # -------------------------------------
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      # -------------------------------------
      # 4. Python environment (PINNED + STABLE)
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      # -------------------------------------
      # 5. Python dependencies (SAFE + NO LXML GUARANTEE)
      # -------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4

        env:
          BS4_NO_LXML: "1"

      # -------------------------------------
      # 6. Make scripts executable
      # -------------------------------------
      - name: Make scripts executable
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh

      # -------------------------------------
      # 7. Generate FULL SITE (single truth pipeline)
      # -------------------------------------
      - name: Generate site (semantic-salience only)
        shell: bash
        run: |
          set -euo pipefail
          echo "🚀 Starting generate-site.sh"
          ./scripts/generate-site.sh

      # -------------------------------------
      # 8. VALIDATE TRUTH LAYER (STRICT + FAIL SAFE)
      # -------------------------------------
      - name: Inspect semantic-salience truth layer
        shell: bash
        run: |
          set -euo pipefail

          echo "🔍 Inspecting semantic-salience.json..."

          if [ ! -f semantic-salience.json ]; then
            echo "❌ semantic-salience.json missing — HARD STOP"
            exit 1
          fi

          echo "📦 File exists. Running inspection..."

          python3 scripts/inspect-semantic-salience.py

          # HARD STRUCTURE VALIDATION (prevents silent corruption)
          python3 - <<'PY'
import json, sys

print("🧠 Loading semantic-salience.json...")

try:
    with open("semantic-salience.json","r",encoding="utf-8") as f:
        data = json.load(f)
except Exception as e:
    print("❌ JSON parse failure:", e)
    sys.exit(1)

if not isinstance(data, dict):
    print("❌ semantic-salience must be dict")
    sys.exit(1)

required = ["nodes", "edges", "page_graph"]

for key in required:
    if key not in data:
        print(f"❌ missing required key: {key}")
        sys.exit(1)

print("✅ semantic-salience validation PASSED")
PY

      # -------------------------------------
      # 9. VERIFY OUTPUT STRUCTURE (NON-FATAL BUT INFORMATIVE)
      # -------------------------------------
      - name: Verify build outputs
        shell: bash
        run: |
          echo "📦 Checking output structure..."

          test -f semantic-salience.json

          echo "📂 Repo snapshot:"
          ls -R . | grep -E "semantic|sitemap|rss|homepage|feed" || true

      # -------------------------------------
      # 10. Upload Pages artifact (ROOT-BASED ONLY)
      # -------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4