name: Build Unbound Healing Site

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Generate full site system
        run: |
          ./scripts/generate-site.sh

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add feed.xml sitemap.xml link-reference.md search-index.json tags.json || true
          git commit -m "Auto-build site outputs [skip ci]" || echo "No changes to commit"

      - name: Push changes
        run: |
          git push
