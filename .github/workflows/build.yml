name: Build Unbound Healing Site (v3.5 Semantic-Salience Truth System)

on:
  push:
    branches:
      - main

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------
      # 1. Checkout repo
      # -------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------------------
      # 2. System dependencies
      # -------------------------------------
      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      # -------------------------------------
      # 3. Python environment
      # -------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install beautifulsoup4

      # -------------------------------------
      # 4. Make scripts executable
      # -------------------------------------
      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      # -------------------------------------
      # 5. Generate FULL SITE (single truth pipeline)
      # -------------------------------------
      - name: Generate site (semantic-salience only)
        run: |
          set -euo pipefail
          ./scripts/generate-site.sh

      # -------------------------------------
      # 6. VALIDATE SINGLE TRUTH LAYER
      # -------------------------------------
      - name: Inspect semantic-salience truth layer
        run: |
          echo "🔍 Inspecting semantic-salience.json..."

          if [ ! -f semantic-salience.json ]; then
            echo "❌ semantic-salience.json missing"
            exit 1
          fi

          python3 scripts/inspect-semantic-salience.py

      # -------------------------------------
      # 7. Verify output structure (lightweight)
      # -------------------------------------
      - name: Verify build outputs
        run: |
          echo "📦 Checking output files..."
          ls -R ./assets || true
          ls -R ./ | grep -E "semantic|sitemap|rss|word|homepage" || true

      # -------------------------------------
      # 8. Upload Pages artifact
      # -------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
