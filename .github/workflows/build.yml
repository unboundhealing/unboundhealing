name: Unbound Healing Site Generator v1.3

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up permissions
        run: chmod +x scripts/*.sh

      - name: Run site generator (RSS + sitemap + indexes)
        run: ./scripts/generate-site.sh

      - name: Validate output
        run: |
          echo "Checking generated files..."
          test -f feed.xml
          test -f sitemap.xml

      - name: Upload generated artifacts (optional)
        uses: actions/upload-artifact@v4
        with:
          name: site-output
          path: |
            feed.xml
            sitemap.xml
            link-reference.md
            search-index.json
