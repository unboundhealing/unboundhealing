name: Build Unbound Healing Site (v3 Stable)

on:
  push:
    branches:
      - main
    paths-ignore:
      - feed.xml
      - sitemap.xml
      - link-reference.md
      - search-index.json
      - tags.json

concurrency:
  group: build-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Generate full site system
        run: |
          set -e
          ./scripts/generate-site.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unbound-healing-build
          path: |
            feed.xml
            sitemap.xml
            link-reference.md
            search-index.json
            tags.json
