name: Diagnose Search Index

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Make scripts executable
        run: chmod +x scripts/build-search-index.sh
        
      - name: Build search index
        run: bash scripts/build-search-index.sh

      - name: Run diagnostic
        run: python3 assets/diagnose-search-index.py
